<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boss Alarm</title>
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <!-- Màn hình đăng nhập -->
  <div id="login" class="login">
    <h1>⚔️ Boss Alarm</h1>
    <form id="loginForm">
      <input id="u" placeholder="Tài khoản" autocomplete="username" required>
      <input id="p" type="password" placeholder="Mật khẩu" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Đăng nhập</button>
      <div id="loginErr" class="err small"></div>
    </form>
  </div>

  <!-- Giao diện chính (ẩn cho đến khi đăng nhập) -->
  <div id="app" hidden>
    <header>
      <h1>⚔️ Boss Alarm</h1>
      <div id="clock" class="clock">--:--:--</div>
      <div id="filters" class="chips"></div>
      <span class="spacer"></span>
      <button id="enableBtn" class="btn primary">🔔 Bật âm thanh</button>
      <button id="settingsBtn" class="btn" title="Ẩn / hiện khung cài đặt">Ẩn/Hiện</button>
      <button id="logoutBtn" class="btn" title="Đăng xuất">⎋</button>
    </header>

    <!-- Khung cài đặt: bấm "Ẩn/Hiện" ở trên để ẩn / hiện -->
    <section id="settings" class="panel">
      <div class="sheetrow">
        <span class="muted">📄 Sheet</span>
        <input id="sheetLink" placeholder="Dán link Google Sheet vào đây" spellcheck="false">
        <button id="sheetSave" class="btn">Lưu</button>
      </div>
      <div id="sheetMsg" class="small"></div>

      <label>Báo trước
        <select id="warnSelect">
          <option value="30">30 giây</option>
          <option value="60">1 phút</option>
          <option value="90">1 phút 30</option>
          <option value="120">2 phút</option>
          <option value="180">3 phút</option>
        </select>
      </label>
      <label>Ngắt boss đã ra sau
        <select id="graceSel">
          <option value="5">5 phút</option>
          <option value="10">10 phút</option>
          <option value="15">15 phút</option>
        </select>
      </label>
      <label><input type="checkbox" id="beepChk"> Hô "Boss Boss" (giọng nữ)</label>
      <label><input type="checkbox" id="voiceChk"> Đọc tên boss</label>
      <label>Giọng đọc tên <select id="voiceSel"><option>…</option></select></label>
      <label>🔊 Âm lượng
        <input type="range" id="volRange" min="0" max="100" step="5" style="width:90px;vertical-align:middle;accent-color:#4f8cff">
        <span id="volVal" class="muted small">100%</span>
      </label>
      <button id="testBtn" class="btn">▶ Thử</button>
      <span class="sep"></span>
      <span class="muted">Màu chữ server:</span>
      <span id="colorPickers" class="colorpicks"></span>
      <div class="voicerow">
        <span class="muted">Giọng theo server:</span>
        <span id="groupVoices" class="colorpicks"></span>
        <span class="muted small">(giọng riêng từng boss: bấm 🎙 sau tên boss)</span>
      </div>
      <span id="status" class="muted small"></span>
    </section>

    <table>
      <thead>
        <tr>
          <th>Tên boss</th>
          <th class="ctl" title="🔔 bật/tắt chuông báo · 🎙 giọng đọc riêng"></th>
          <th class="num">Time ra</th>
          <th class="num">Đếm ngược</th>
          <th class="num">Time chết</th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>

    <p class="muted small foot">Giữ tab này mở. Lần đầu phải bấm "Bật âm thanh" thì trình duyệt mới cho phát tiếng.</p>
  </div>

  <script src="app.js?v=9"></script>
</body>
</html>
