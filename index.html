<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Boss Alarm</title>
  <link rel="stylesheet" href="style.css?v=20">
</head>
<body>
  <!-- Màn hình đăng nhập -->
  <div id="login" class="login">
    <h1>⏰ Boss Alarm</h1>
    <form id="loginForm">
      <input id="u" placeholder="Tài khoản" autocomplete="username" required>
      <input id="p" type="password" placeholder="Mật khẩu" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Đăng nhập</button>
      <div id="loginErr" class="err small"></div>
    </form>
  </div>

  <!-- Giao diện chính (ẩn cho đến khi đăng nhập) -->
  <div id="app" hidden>
    <header>
      <div class="brand">
        <h1>⏰ Boss Alarm</h1>
        <div class="vol"><button type="button" id="volIcon" class="volbtn" title="Bấm để tắt / bật tiếng">🔊</button> Âm lượng
          <input type="range" id="volRange" min="0" max="100" step="5">
          <span id="volVal">100%</span>
        </div>
      </div>
      <div id="clock" class="clock">--:--:--</div>
      <div id="filters" class="chips"></div>
      <div class="hbtns">
        <button id="enableBtn" class="btn primary">🔔 Bật âm thanh</button>
        <button id="settingsBtn" class="btn" title="Ẩn / hiện bảng cài đặt">Ẩn/hiện bảng cài đặt</button>
        <button id="logoutBtn" class="btn" title="Đăng xuất">⎋</button>
      </div>
    </header>

    <!-- Bảng cài đặt: bấm "Ẩn/hiện bảng cài đặt" ở trên để ẩn / hiện -->
    <section id="settings" class="panel">
      <div class="prow">
        <label>Báo trước
          <select id="warnSelect">
            <option value="30">30 giây</option>
            <option value="60">1 phút</option>
            <option value="90">1 phút 30</option>
            <option value="120">2 phút</option>
            <option value="180">3 phút</option>
          </select>
        </label>
        <label>Hiện trước
          <select id="lookSel">
            <option value="60">1 tiếng</option>
            <option value="120">2 tiếng</option>
            <option value="180">3 tiếng</option>
            <option value="360">6 tiếng</option>
            <option value="0">Tất cả</option>
          </select>
        </label>
        <label>Ngắt boss đã ra sau
          <select id="graceSel">
            <option value="5">5 phút</option>
            <option value="10">10 phút</option>
            <option value="15">15 phút</option>
          </select>
        </label>
        <label>Tốc độ đọc
          <select id="rateSel">
            <option value="1">x1</option>
            <option value="1.25">x1,25</option>
            <option value="1.5">x1,5</option>
            <option value="1.75">x1,75</option>
            <option value="2">x2</option>
          </select>
        </label>
      </div>

      <div class="prow">
        <label><input type="checkbox" id="beepChk"> Âm báo "Boss Boss"</label>
        <select id="beepVoiceSel" title="Giọng hô Boss Boss">
          <option value="female">Giọng nữ</option>
          <option value="male">Giọng nam</option>
        </select>
        <button id="testBtn" class="btn">▶ Thử</button>
      </div>

      <div class="prow">
        <label title='Báo trước đọc kiểu: "Ca sáu có boss", "Tê bảy xâm lược có boss"'><input type="checkbox" id="svChk"> Đọc tên server</label>
        <select id="svVoiceSel" title="Giọng đọc tên server"></select>
        <button id="svTest" class="btn">▶ Thử</button>
      </div>

      <div class="prow">
        <label><input type="checkbox" id="voiceChk"> Đọc tên boss</label>
        <select id="voiceSel" title="Giọng đọc tên boss"><option>…</option></select>
        <button id="nameTest" class="btn">▶ Thử</button>
      </div>

      <div class="prow">
        <label><input type="checkbox" id="dingChk"> Bật âm báo khi boss ra</label>
        <select id="dingSel" title="Kiểu âm báo">
          <option value="ding">Ding ding</option>
          <option value="ting">Ting ting</option>
          <option value="voice">Boss ra</option>
        </select>
        <select id="dingVoiceSel" title="Giọng đọc &quot;Boss ra&quot; (chỉ dùng khi chọn kiểu Boss ra)"></select>
        <button id="dingTest" class="btn">▶ Thử</button>
      </div>

      <div class="prow">
        <span class="muted">Màu chữ &amp; giọng đọc theo server:</span>
        <span class="muted small">(giọng riêng từng boss: bấm 🎙 sau tên boss)</span>
      </div>
      <div id="serverCfg" class="srows"></div>
      <span id="status" class="muted small"></span>
    </section>

    <table>
      <thead>
        <tr>
          <th>Tên boss</th>
          <th class="num">Time ra</th>
          <th class="num sortable" id="sortCd">Đếm ngược <span id="sortMark">⇅</span></th>
          <th class="num">Time chết</th>
          <th class="ctl" title="chuông: bật/tắt báo · 📌 neo boss lên đầu · 🎙 giọng đọc riêng"></th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>

    <p class="muted small foot">Giữ tab này mở. Lần đầu phải bấm "Bật âm thanh" thì trình duyệt mới cho phát tiếng.</p>
  </div>

  <script src="app.js?v=27"></script>
</body>
</html>
